<svg xmlns="http://www.w3.org/2000/svg" width="1144" height="979" viewBox="0 0 1144 979"><rect width="100%" height="100%" fill="#faf8fb"/><text x="14" y="24" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2a2630">8 Drei Zonen der Wand (#282) und wie die Bausteine anschließen</text><rect x="110.0" y="495.0" width="220.0" height="385.0" fill="#f3eff2" stroke="#999" stroke-width="1"/><rect x="110.0" y="825.0" width="220.0" height="55.0" fill="#cdbfc6" stroke="#2a2630" stroke-width="1"/><rect x="110.0" y="495.0" width="220.0" height="55.0" fill="#cdbfc6" stroke="#2a2630" stroke-width="1"/><text x="220.0" y="858.0" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#2a2630" text-anchor="middle" font-weight="normal">Sockel 0,50</text><text x="220.0" y="528.0" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#2a2630" text-anchor="middle" font-weight="normal">Abschluss 0,50</text><text x="220.0" y="687.5" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2a2630" text-anchor="middle" font-weight="normal">Fläche</text><text x="220.0" y="481.8" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">Gang 3,5 m</text><rect x="418.0" y="220.0" width="220.0" height="660.0" fill="#f3eff2" stroke="#999" stroke-width="1"/><rect x="418.0" y="825.0" width="220.0" height="55.0" fill="#cdbfc6" stroke="#2a2630" stroke-width="1"/><rect x="418.0" y="220.0" width="220.0" height="55.0" fill="#cdbfc6" stroke="#2a2630" stroke-width="1"/><text x="528.0" y="858.0" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#2a2630" text-anchor="middle" font-weight="normal">Sockel 0,50</text><text x="528.0" y="253.0" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#2a2630" text-anchor="middle" font-weight="normal">Abschluss 0,50</text><text x="528.0" y="550.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2a2630" text-anchor="middle" font-weight="normal">Fläche</text><text x="528.0" y="206.8" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">Raum 6 m</text><rect x="110.0" y="660.0" width="27.5" height="220.0" fill="#e0d5da" stroke="#2a2630" stroke-width="1.5"/><rect x="110.0" y="852.5" width="33.0" height="27.5" fill="#bfb0b8" stroke="#2a2630" stroke-width="1.5"/><rect x="110.0" y="660.0" width="33.0" height="27.5" fill="#bfb0b8" stroke="#2a2630" stroke-width="1.5"/><text x="159.5" y="770.0" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="start" font-weight="normal">Pfeiler: Basis auf Sockelband,</text><text x="159.5" y="783.2" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="start" font-weight="normal">Kapitell unter dem Abschluss</text><rect x="550.0" y="275.0" width="88.0" height="605.0" fill="#e0d5da" stroke="#2a2630" stroke-width="1.5"/><rect x="539.0" y="841.5" width="110.0" height="38.5" fill="#bfb0b8" stroke="#2a2630" stroke-width="1.5"/><rect x="539.0" y="275.0" width="110.0" height="55.0" fill="#bfb0b8" stroke="#2a2630" stroke-width="1.5"/><line x1="55.0" y1="880.0" x2="715.0" y2="880.0" stroke="#2a2630" stroke-width="2.5"/><text x="671.0" y="852.5" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#555" text-anchor="start" font-weight="normal">← Sockelband: Anfang | Mitte (wiederholbar) | Ende</text><text x="671.0" y="866.8" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#555" text-anchor="start" font-weight="normal">Baustein steht VOR dem Band und deckt es ab:</text><text x="671.0" y="881.1" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#555" text-anchor="start" font-weight="normal">Bandende = Pfeilerkante, nie nackte Kante</text></svg>